<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PO • IT Portfolio</title>
  <meta name="description" content="Modern, digital IT portfolio showcasing skills, projects, and contact." />

  <!-- Optional: Google Fonts (safe to remove if you prefer system fonts) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1020;
      --bg-elev: #111833;
      --text: #e8eeff;
      --muted: #a8b0c7;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #39d0ff;
      --accent-2: #8a5cff;
      --glow: 0 0 24px rgba(57,208,255,0.35);
      --radius: 14px;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --maxw: 1100px;
      --pad: clamp(16px, 2vw, 28px);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
    }

    /* Light theme */
    [data-theme="light"] {
      --bg: #f5f7fb;
      --bg-elev: #ffffff;
      --text: #0d1321;
      --muted: #4d5875;
      --card: rgba(10,20,30,0.04);
      --border: rgba(10,20,30,0.08);
      --accent: #0066ff;
      --accent-2: #7a38ff;
      --glow: 0 0 24px rgba(0,102,255,0.25);
      --shadow: 0 10px 30px rgba(0,10,20,0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background: radial-gradient(1200px 1200px at 80% -10%, rgba(57,208,255,0.08), transparent 40%),
                  radial-gradient(1000px 800px at -10% 110%, rgba(138,92,255,0.10), transparent 50%),
                  var(--bg);
      line-height: 1.65;
      scroll-behavior: smooth;
    }

    /* Animated subtle gradient overlay */
    .bg-anim {
      position: fixed; inset: -10% -10% auto -10%;
      height: 60vh;
      background: conic-gradient(from 180deg at 50% 50%, rgba(57,208,255,0.12), rgba(138,92,255,0.12), rgba(57,208,255,0.12));
      filter: blur(80px) saturate(130%);
      opacity: 0.35;
      animation: spin 24s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* Container */
    .wrap { width: min(100% - 2*var(--pad), var(--maxw)); margin-inline: auto; position: relative; z-index: 2; }

    /* Navbar */
    .nav {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(10,15,30,0.65), rgba(10,15,30,0.35));
      border-bottom: 1px solid var(--border);
    }
    [data-theme="light"] .nav {
      background: linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0.65));
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px var(--pad);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.3px;
    }
    .brand .logo {
      width: 28px; height: 28px; display: grid; place-items: center;
      border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: var(--glow);
      color: #fff; font-family: var(--mono); font-size: 14px;
    }
    .nav-links {
      display: flex; gap: 18px; align-items: center;
    }
    .nav-links a {
      color: var(--muted); text-decoration: none; font-weight: 600; padding: 8px 10px; border-radius: 8px;
      position: relative;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active::after, .nav-links a:hover::after {
      content: ""; position: absolute; left: 10px; right: 10px; bottom: 2px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 2px;
    }
    .controls { display: flex; align-items: center; gap: 8px; }

    .btn, .icon-btn {
      cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text);
      padding: 10px 14px; border-radius: 10px; font-weight: 600;
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .btn:hover, .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--glow), var(--shadow); border-color: transparent; }
    .icon-btn { padding: 8px 10px; display: grid; place-items: center; }
    .only-mobile { display: none; }

    @media (max-width: 880px) {
      .nav-links { display: none; }
      .only-mobile { display: inline-grid; }
      .mobile-menu {
        display: none; position: fixed; top: 54px; right: var(--pad); left: var(--pad);
        background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); z-index: 40;
        box-shadow: var(--shadow);
      }
      .mobile-menu.open { display: block; }
      .mobile-menu a { display: block; padding: 14px 16px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
      .mobile-menu a:last-child { border-bottom: 0; }
    }

    /* Sections */
    section { padding: clamp(48px, 8vw, 120px) 0; }
    .section-head {
      display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px;
    }
    .eyebrow {
      display: inline-flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card); color: var(--muted); font-weight: 700; font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase;
    }
    h1, h2, h3 { margin: 0; line-height: 1.2; }
    h1 { font-size: clamp(28px, 6vw, 56px); }
    h2 { font-size: clamp(22px, 4vw, 36px); }
    p.lead { color: var(--muted); font-size: clamp(14px, 2.2vw, 18px); max-width: 70ch; }

    /* Hero */
    .hero {
      display: grid; gap: 28px; align-items: center;
      grid-template-columns: 1.2fr 1fr;
    }
    @media (max-width: 980px) { .hero { grid-template-columns: 1fr; } }

    .headline-gradient {
      background: linear-gradient(90deg, var(--text), var(--accent) 55%, var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 6px 18px rgba(57,208,255,0.15));
    }
    .hero .cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-card {
      border: 1px solid var(--border); background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border-radius: var(--radius); padding: 18px; display: grid; gap: 12px;
      box-shadow: var(--shadow); backdrop-filter: blur(6px);
    }
    .mini-kpis {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .kpi { border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 12px; text-align: center; }
    .kpi strong { display: block; font-size: 18px; }
    .kpi span { color: var(--muted); font-size: 12px; }

    /* Skills */
    .skills-grid {
      display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px;
    }
    .skill-card {
      grid-column: span 4; min-height: 120px;
      border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .skill-card:hover { transform: translateY(-4px); box-shadow: var(--glow), var(--shadow); border-color: transparent; }
    .skill-title { font-weight: 800; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      font-family: var(--mono); font-size: 12px; padding: 6px 10px; border-radius: 999px; color: var(--text);
      background: linear-gradient(90deg, rgba(57,208,255,0.24), rgba(138,92,255,0.24));
      border: 1px solid var(--border);
    }
    @media (max-width: 900px) { .skill-card { grid-column: span 6; } }
    @media (max-width: 600px) { .skill-card { grid-column: span 12; } }

    /* Projects */
    .cards {
      display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px;
    }
    .card {
      grid-column: span 6;
      border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px;
      position: relative; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover { transform: translateY(-6px); box-shadow: var(--glow), var(--shadow); border-color: transparent; }
    @media (max-width: 900px) { .card { grid-column: span 12; } }

    .chip {
      display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted);
      padding: 6px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--border);
    }
    .meta { color: var(--muted); font-size: 14px; }
    .mono { font-family: var(--mono); }

    /* Contact */
    .contact {
      display: grid; gap: 16px; grid-template-columns: 1.2fr 1fr;
    }
    @media (max-width: 980px) { .contact { grid-template-columns: 1fr; } }
    .field { display: grid; gap: 8px; }
    input, textarea {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card);
      color: var(--text); outline: none;
    }
    input:focus, textarea:focus { border-color: transparent; box-shadow: var(--glow), var(--shadow); }
    textarea { min-height: 120px; resize: vertical; }

    /* Footer */
    footer {
      border-top: 1px solid var(--border); background: rgba(0,0,0,0.15);
      padding: 18px var(--pad); color: var(--muted); font-size: 14px;
    }
    [data-theme="light"] footer { background: rgba(255,255,255,0.5); }

    /* Reveal on scroll */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
    .reveal.in { opacity: 1; transform: translateY(0); }
  </style>
</head>
